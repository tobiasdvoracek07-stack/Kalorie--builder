name: Build and Send APK
on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Moje Appka</title>
          </head>
          <body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#111;color:#fff;">
            <h1>Aplikace funguje! 🚀</h1>
          </body>
          </html>
          EOF

          npx cap init KalorieApp com.kalorie.app --web-dir www
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Send APK to Telegram
        run: |
          curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F document=@"android/app/build/outputs/apk/debug/app-debug.apk" \
               -F caption="🚀 Tvé APK je hotové!" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"
